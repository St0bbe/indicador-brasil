name: Inspecionar base mensal Sinesp
on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano a inspecionar
        type: choice
        required: true
        default: '2025'
        options:
          - '2024'
          - '2025'
          - '2026'
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Baixar planilha anual do portal gov.br
        env:
          ANO: ${{ inputs.ano }}
        run: |
          set -euo pipefail
          URL="https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica/download/dnsp-base-de-dados/bancovde-${ANO}.xlsx/@@download/file"
          echo "Tentando fonte alternativa oficial www.gov.br para o ano ${ANO}"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0" "$URL" --output sinesp.xlsx
          python -c "import zipfile; assert zipfile.is_zipfile('sinesp.xlsx'), 'Resposta nao e um XLSX valido'"
      - name: Inspecionar arquivos e colunas
        run: python scripts/inspecionar_sinesp.py sinesp.xlsx > estrutura-sinesp.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: estrutura-sinesp-${{ inputs.ano }}
          path: estrutura-sinesp.txt
          retention-days: 7
